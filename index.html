<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odkazy | Antonín Havlátko</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .profile-img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 2px solid #38bdf8;
            object-fit: cover;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid #334155;
            transition: all 0.2s ease;
        }

        .link-btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
            color: #ffffff;
        }

        .contact-section {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .contact-item {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }

        .contact-item:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Načítá profilové foto z tvořícího se GitHubu -->
        <img class="profile-img" src="https://github.com/anton1n-c0de.png" alt="Antonín Havlátko">
        
        <h1>Antonín Havlátko</h1>
        <p class="subtitle">Osobní rozcestník</p>

        <!-- Hlavní sociální sítě / odkazy -->
        <div class="links">
            <a href="https://github.com/anton1n-c0de" class="link-btn" target="_blank" rel="noopener">GitHub</a>
            <a href="https://instagram.com/tech_tonda" class="link-btn" target="_blank" rel="noopener">Instagram (@tech_tonda)</a>
        </div>

        <!-- Přímé kontakty -->
        <div class="contact-section">
            <a href="tel:+420775336249" class="contact-item">📞 +420 775 336 249</a>
            <a href="mailto:ahavlatko@protonmail.com" class="contact-item">✉️ ahavlatko@protonmail.com</a>
        </div>
    </div>

</body>
</html>
