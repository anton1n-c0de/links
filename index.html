<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odkazy | Antonín Havlátko</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 20px;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid #334155;
            transition: all 0.2s ease;
            cursor: pointer;
            width: 100%;
        }

        .link-btn:hover {
            background-color: #334155;
            border-color: #38bdf8;
            transform: translateY(-2px);
            color: #ffffff;
        }

        .contact-display {
            display: none;
            padding: 14px 20px;
            background-color: #0f172a;
            border: 1px solid #38bdf8;
            border-radius: 12px;
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
            transition: all 0.2s ease;
        }

        .contact-display:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Antonín Havlátko</h1>

        <div class="links">
            <!-- 1. Telefon -->
            <button id="phone-btn" class="link-btn" onclick="revealPhone()">📞 Telefon</button>
            <a id="phone-link" class="contact-display" href="#"></a>

            <!-- 2. E-mail -->
            <button id="email-btn" class="link-btn" onclick="revealEmail()">✉️ E-mail</button>
            <a id="email-link" class="contact-display" href="#"></a>

            <!-- 3. GitHub -->
            <a href="https://github.com/anton1n-c0de" class="link-btn" target="_blank" rel="noopener">GitHub</a>

            <!-- 4. Instagram -->
            <a href="https://instagram.com/tech_tonda" class="link-btn" target="_blank" rel="noopener">Instagram (@tech_tonda)</a>
        </div>
    </div>

    <script>
        function revealPhone() {
            // Zakódované telefonní číslo (+420 775 336 249)
            const encodedPhone = "KzQyMCA3NzUgMzM2IDI0OQ==";
            const phone = atob(encodedPhone);
            
            const btn = document.getElementById('phone-btn');
            const link = document.getElementById('phone-link');
            
            link.href = "tel:" + phone.replace(/\s+/g, '');
            link.textContent = phone;
            btn.style.display = 'none';
            link.style.display = 'block';
        }

        function revealEmail() {
            // Zakódovaný e-mail (ahavlatko@protonmail.com)
            const encodedEmail = "YWhhdmxhdGtvQHByb3Rvbm1haWwuY29t";
            const email = atob(encodedEmail);
            
            const btn = document.getElementById('email-btn');
            const link = document.getElementById('email-link');
            
            link.href = "mailto:" + email;
            link.textContent = email;
            btn.style.display = 'none';
            link.style.display = 'block';
        }
    </script>

</body>
</html>
